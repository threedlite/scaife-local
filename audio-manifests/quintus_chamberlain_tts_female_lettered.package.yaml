# Manifest for the audio package in this directory. Read by
# `python manage.py ingest_audio` (sv_pdl/localaudio). The mp4 tree carries
# no identifiers of its own, so this file maps each Author/Work folder to
# the CTS version URN it was read from. See AUDIO-PROPOSAL.md, Appendix A.
slug: quintus-chamberlain-tts-female-lettered
label: "Quintus Smyrnaeus, Posthomerica, synthesized reading (Chamberlain TTS, female voice)"
license: CC BY-SA 4.0
source: https://github.com/threedlite/hesiod
# The Posthomerica is cited book.line, so book_N/line_n.mp4 is reference N.n.
cited_by_book: true
works:
  "Quintus Smyrnaeus/Fall of Troy": urn:cts:greekLit:tlg2046.tlg001.perseus-grc2
# Verbatim from ~/git/hesiod/LICENSE (everything above the legal code).
# CC BY-SA 4.0 requires this notice to travel with the audio.
