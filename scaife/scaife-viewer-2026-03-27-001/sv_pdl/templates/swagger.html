{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaife Viewer — Local API</title>
  <link rel="stylesheet" href="{% static 'vendor/swagger-ui/swagger-ui.css' %}">
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'vendor/swagger-ui/favicon-32x32.png' %}">
  <link rel="icon" type="image/png" sizes="16x16" href="{% static 'vendor/swagger-ui/favicon-16x16.png' %}">
  <style>body{margin:0;background:#fafafa}</style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="{% static 'vendor/swagger-ui/swagger-ui-bundle.js' %}" charset="UTF-8"></script>
  <script src="{% static 'vendor/swagger-ui/swagger-ui-standalone-preset.js' %}" charset="UTF-8"></script>
  <script>
    window.onload = function() {
      window.ui = SwaggerUIBundle({
        url: "/api/openapi.json",
        dom_id: "#swagger-ui",
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset,
        ],
        plugins: [SwaggerUIBundle.plugins.DownloadUrl],
        layout: "StandaloneLayout",
      });
    };
  </script>
</body>
</html>
