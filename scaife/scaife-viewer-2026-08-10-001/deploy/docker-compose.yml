services:
  scaife-viewer:
    build:
      context: ../
      dockerfile: Dockerfile
    container_name: scaife-viewer
    command: gunicorn sv_pdl.wsgi:application
    depends_on:
      sv-postgres:
        condition: service_healthy
      sv-opensearch:
        condition: service_healthy
    ports:
      # Bind to loopback by default so LAN peers can't hit the app / DB / ES.
      # Override with e.g. SCAIFE_BIND=0.0.0.0 to expose on the LAN.
      - ${SCAIFE_BIND:-127.0.0.1}:${SCAIFE_VIEWER_PORT:-8000}:8000
    env_file: .env

  sv-postgres:
    container_name: sv-postgres
    # LOCAL CHANGE (2026-08-14): was postgres:9.6-alpine, EOL since
    # 2021-11. 17 rather than 18 deliberately: the official 18 image moved
    # PGDATA to a version-specific path (/var/lib/postgresql/18/docker),
    # which would bake the major version into the volume mount and need
    # redoing at 19. 17 keeps /var/lib/postgresql/data and is supported to
    # 2029, comfortably past the Django 5.2 target.
    image: postgres:17-alpine
    ports:
      - ${SCAIFE_BIND:-127.0.0.1}:${SV_POSTGRES_PORT:-5433}:5432
    environment:
      - POSTGRES_USER=scaife
      - POSTGRES_PASSWORD=scaife
      - USE_OPENSEARCH_SERVICE=1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - sv-postgres-17-data:/var/lib/postgresql/data

  sv-opensearch:
    build:
      context: ../
      dockerfile: Dockerfile-opensearch
    container_name: sv-opensearch
    environment:
      - cluster.name=docker-cluster
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - discovery.type=single-node
      # No auth, matching the previous xpack.security.enabled=false posture.
      # Safe only behind the loopback binding; see README security notes.
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - ${SCAIFE_BIND:-127.0.0.1}:9200:9200
    volumes:
      - sv-opensearch-data:/usr/share/opensearch/data

volumes:
  # sv-postgres-data holds the old 9.6 cluster. A 9.6 data directory
  # cannot be read by 17, so the upgrade went via pg_dump/restore into
  # this new volume. The old one is left declared so it is not garbage
  # collected, and remains a rollback path until the upgrade is trusted.
  sv-postgres-data:
  sv-postgres-17-data:
  sv-opensearch-data:
